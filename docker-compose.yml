# Local stack for the Freshness Control Plane.
# All ports bind to 127.0.0.1 only. Credentials come from .env (see .env.example).
name: fcp

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: ${FCP_PG_USER:-fcp}
      POSTGRES_PASSWORD: ${FCP_PG_PASSWORD:-fcp_local_only}
      POSTGRES_DB: ${FCP_PG_DB:-fcp}
    # Logical replication is required by Debezium (ADR-001).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "127.0.0.1:${FCP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Schema comes from db/migrations via `fcp db upgrade` (run by `make up`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.0
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # any 22-char base64 UUID; fixed for a reproducible local cluster
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://kafka:19092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The image defaults to /tmp/kraft-combined-logs; keep data on the named volume instead,
      # otherwise recreating the container silently drops every topic and Connect's offsets.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  connect:
    image: quay.io/debezium/connect:3.5
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: fcp-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Commit source offsets every 10 s (default 60 s) so a restart replays at most ~10 s of
      # changes. Replays are still possible (at-least-once); consumers are idempotent.
      OFFSET_FLUSH_INTERVAL_MS: 10000
      # Secrets are resolved inside the worker (${env:...} in connector config), so they never
      # appear in the connector config stored in Kafka or returned by the REST API.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      FCP_CDC_PASSWORD: ${FCP_CDC_PASSWORD:-fcp_cdc_local_only}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  reindex:
    # Selective re-index consumer (Phase 3). Started by `make up-app`; the core stack does not need it.
    build: .
    profiles: ["app"]
    command: ["reindex", "run"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      FCP_PG_HOST: postgres
      FCP_PG_USER: ${FCP_PG_USER:-fcp}
      FCP_PG_PASSWORD: ${FCP_PG_PASSWORD:-fcp_local_only}
      FCP_PG_DB: ${FCP_PG_DB:-fcp}
      FCP_KAFKA_BOOTSTRAP: kafka:19092
      FCP_CONNECT_URL: http://connect:8083
    volumes:
      - models:/data/models
    healthcheck:
      # Healthy only while the consume loop is turning (heartbeat touched within 60 s). The first
      # start downloads the model (~64 MB), hence the generous start period.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/fcp-reindex.heartbeat -mmin -1 2>/dev/null)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
  kafkadata:
  models:
