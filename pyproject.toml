[project]
name = "freshness-control-plane"
version = "0.1.0"
description = "Detects stale aviation data and stops a RAG agent from presenting outdated answers with full confidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Core: what the long-running services need (CDC tooling, re-index consumer, CLI).
dependencies = [
    "confluent-kafka>=2.15.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
# Batch ingestion, the Iceberg lake, dbt and Dagster. Installed for development and CI
# (`uv sync --all-extras`), left out of the service image.
pipeline = [
    "dagster>=1.13.25",
    "dagster-dbt>=0.29.25",
    "dagster-webserver>=1.13.25",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
fcp = "fcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcp"]

[tool.dagster]
module_name = "fcp.orchestration.definitions"
code_location_name = "fcp"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "DTZ"]
ignore = [
    "S101",   # assert is fine in tests
    "S608",   # SQL is built from identifiers we control, values are always parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018"]  # compound asserts read better in these tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fcp"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyiceberg.*", "dagster_dbt.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local Postgres from docker compose (make up)",
    "model: downloads and runs the real embedding model (BAAI/bge-small-en-v1.5, ~64 MB, cached in data/models)",
]
