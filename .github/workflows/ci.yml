name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: fcp
          POSTGRES_PASSWORD: fcp_local_only
          POSTGRES_DB: fcp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcp -d fcp" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Apply schema
        run: psql "postgresql://fcp:fcp_local_only@localhost:5432/fcp" -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
      - name: Tests (unit + integration)
        run: uv run pytest --cov=fcp --cov-report=term-missing
